<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lezzet & Anı Günlüğümüz 🍕❤️</title>
    <style>
        :root {
            --primary: #ff4757;
            --bg: #fff5f5;
            --card-bg: #ffffff;
            --text: #2f3542;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #747d8c;
            font-style: italic;
        }

        /* Form Stilleri */
        .form-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.1);
            margin-bottom: 35px;
        }

        .form-card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.4rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #dfe4ea;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        button.add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button.add-btn:hover {
            background: #e84118;
        }

        /* Restoran Kartları Grid */
        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
