<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lezzet & Anı Günlüğümüz 🍕❤️</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #ff6b81;
            --bg: #fff0f3;
            --card-bg: #ffffff;
            --text: #2f3542;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.4rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(255, 71, 87, 0.1);
        }

        header p {
            color: #ff6b81;
            font-style: italic;
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 35px;
        }

        .btn-add {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5);
        }

        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .res-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(255, 107, 129, 0.12);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .res-card:hover {
            transform: translateY(-4px);
        }

        .res-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background-color: #f1f2f6;
        }

        .res-content {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .res-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .res-title {
            margin: 0;
            font-size: 1.3rem;
            color: #2f3542;
            font-weight: 700;
        }

        .res-date {
            font-size: 0.85rem;
            color: #a4b0be;
            margin-bottom: 12px;
        }

        .ratings {
            background: #fff5f7;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            font-size: 0.95rem;
            border: 1px solid #ffe3e6;
        }

        .rating-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .rating-row:last-child {
            margin-bottom: 0;
        }

        .average-badge {
            background: linear-gradient(135deg, #ffa502, #ff7f50);
            color: white;
            padding: 4px 10px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(255, 165, 2, 0.3);
        }

        .notes {
            font-size: 0.9rem;
            color: #57606f;
            margin-top: 10px;
            font-style: italic;
            background: #f8f9fa;
            padding: 8px 12px;
            border-left: 3px solid var(--primary);
            border-radius: 0 8px 8px 0;
        }

        .loading-text {
            text-align: center;
            color: #ff6b81;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            padding: 50px 0;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Lezzet & Anı Günlüğümüz 🍕❤️</h1>
        <p>Birlikte tadına vardığımız anlar, gittiğimiz en güzel mekânlar...</p>
    </header>

    <div class="action-bar">
        <a href="https://forms.gle/EbfSJmB1HUbALAz59" target="_blank" class="btn-add">
            💖 Yeni Bir Anı & Mekân Ekle
        </a>
    </div>

    <div id="restaurantList" class="restaurant-grid">
        <div class="loading-text">Aşk dolu anılar yükleniyor... 🔄</div>
    </div>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRMargRjYfrIulIcjmg8kh7WrNefnO43-JIWRSA8B5-7s760006kmteRvr585jiyn9IoHHnhG6FHd_s/pub?output=csv';
    const defaultImg = 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&q=80';

    // Güvenli CSV Ayrıştırıcı
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        return lines.slice(1).map(line => {
            const values = [];
            let inside = false;
            let entry = '';
            for (let i = 0; i < line.length; i++) {
                let c = line[i];
                if (c === '"') {
                    inside = !inside;
                } else if (c === ',' && !inside) {
                    values.push(entry.trim().replace(/^"|"$/g, ''));
                    entry = '';
                } else {
                    entry += c;
                }
            }
            values.push(entry.trim().replace(/^"|"$/g, ''));
            return values;
        });
    }

    // Google Drive Linklerini doğrudan görsel URL'sine çeviren fonksiyon
    function formatDriveImageUrl(url) {
        if (!url) return '';
        const match = url.match(/[-\w]{25,}/);
        if (match) {
            return `https://lh3.googleusercontent.com/d/${match[0]}`;
        }
        return url;
    }

    async function loadData() {
        const listElement = document.getElementById('restaurantList');
        try {
            const response = await fetch(csvUrl + '&t=' + new Date().getTime(), { cache: 'no-store' });
            if (!response.ok) throw new Error('Ağ yanıtı başarısız');
            
            const dataText = await response.text();
            const rows = parseCSV(dataText);

            listElement.innerHTML = '';

            // Boş satırları filtrele
            const validRows = rows.filter(row => row && row[1] && row[1] !== '');

            if (validRows.length === 0) {
                listElement.innerHTML = '<div class="loading-text">Henüz birlikte keşfettiğimiz bir yer yok. İlk anıyı yukarıdan ekleyelim! 🥂</div>';
                return;
            }

            validRows.reverse().forEach(row => {
                const name = row[1] || 'İsimsiz Mekân';
                const date = row[2] || '';
                const food = parseFloat(row[3]) || 0;
                const service = parseFloat(row[4]) || 0;
                const ambiance = parseFloat(row[5]) || 0;
                const notes = row[6] || '';
                
                const rawImage = row[7] || '';
                const image = formatDriveImageUrl(rawImage) || defaultImg;

                const avg = ((food + service + ambiance) / 3).toFixed(1);

                const card = document.createElement('div');
                card.className = 'res-card';
                card.innerHTML = `
                    <img src="${image}" class="res-image" alt="${name}" onerror="this.src='${defaultImg}'">
                    <div class="res-content">
                        <div>
                            <div class="res-header">
                                <h3 class="res-title">${name}</h3>
                                <span class="average-badge">★ ${isNaN(avg) ? '0.0' : avg}</span>
                            </div>
                            <div class="res-date">📅 ${date}</div>
                            
                            <div class="ratings">
                                <div class="rating-row"><span>🍕 Yemek:</span> <strong>${food}/10</strong></div>
                                <div class="rating-row"><span>🛎️ Servis:</span> <strong>${service}/10</strong></div>
                                <div class="rating-row"><span>✨ Ortam:</span> <strong>${ambiance}/10</strong></div>
                            </div>

                            ${notes ? `<div class="notes">"${notes}"</div>` : ''}
                        </div>
                    </div>
                `;
                listElement.appendChild(card);
            });

        } catch (error) {
            console.error('Hata:', error);
            listElement.innerHTML = '<div class="loading-text">Anılar yüklenirken bir minik aksilik oldu. Lütfen sayfayı yenile! 💫</div>';
        }
    }

    loadData();
</script>

</body>
</html>
